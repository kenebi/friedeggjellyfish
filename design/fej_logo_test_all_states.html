<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FEJ logo — all four states</title>
  <link rel="stylesheet" href="fej_logo_animation.css">
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #FDFEFE;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1B3C5A;
    }
    h1 { font-size: 20px; font-weight: 500; margin: 0 0 8px; }
    p  { font-size: 13px; color: #5F5E5A; margin: 0 0 32px; }
    .row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      max-width: 1100px;
    }
    .demo {
      background: #fff;
      border: 0.5px solid rgba(27,60,90,0.15);
      border-radius: 12px;
      padding: 16px 8px 12px;
      text-align: center;
    }
    .demo svg {
      width: 100%;
      height: auto;
      max-height: 220px;
    }
    .lbl { display: block; margin-top: 4px; font-size: 13px; font-weight: 500; }
    .sub { display: block; font-size: 11px; color: #888780; }
  </style>
</head>
<body>
  <h1>FEJ logo — all four workflow states</h1>
  <p>Compare side-by-side. Running and warn animate; done and error are still.</p>

  <div class="row">
    <div class="demo">
      <div class="slot" data-state="running">Loading…</div>
      <span class="lbl">Running</span>
      <span class="sub">grayscale + shadow pulse</span>
    </div>
    <div class="demo">
      <div class="slot" data-state="done">Loading…</div>
      <span class="lbl">Done</span>
      <span class="sub">full color, still</span>
    </div>
    <div class="demo">
      <div class="slot" data-state="warn">Loading…</div>
      <span class="lbl">Warn</span>
      <span class="sub">amber yolk, pulsing</span>
    </div>
    <div class="demo">
      <div class="slot" data-state="error">Loading…</div>
      <span class="lbl">Error</span>
      <span class="sub">red yolk, still</span>
    </div>
  </div>

  <script>
    fetch('fej_logo.svg')
      .then(r => r.text())
      .then(svgText => {
        document.querySelectorAll('.slot').forEach(slot => {
          slot.innerHTML = svgText;
          const svg = slot.querySelector('svg');
          const state = slot.dataset.state;
          svg.classList.add('fej-logo', 'fej-state-' + state);
        });
      })
      .catch(err => {
        document.querySelectorAll('.slot').forEach(s => s.textContent = 'Failed to load fej_logo.svg');
        console.error(err);
      });
  </script>
</body>
</html>

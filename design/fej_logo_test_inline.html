<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FEJ logo animation — test harness</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #FDFEFE;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1B3C5A;
    }
    h1 { font-size: 20px; font-weight: 500; margin: 0 0 8px; }
    p  { font-size: 13px; color: #5F5E5A; margin: 0 0 24px; }
    .row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
      max-width: 900px;
    }
    .demo {
      background: #fff;
      border: 0.5px solid rgba(27,60,90,0.15);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .demo svg {
      width: 100%;
      height: auto;
      max-height: 280px;
    }
    .lbl { display: block; margin-top: 8px; font-size: 13px; font-weight: 500; }
    .sub { display: block; font-size: 11px; color: #888780; }

    /* Controls for tuning the running effect */
    .controls {
      max-width: 900px;
      margin: 0 0 24px;
      padding: 12px 16px;
      background: #fff;
      border: 0.5px solid rgba(27,60,90,0.15);
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 13px;
    }
    .controls label { display: flex; align-items: center; gap: 8px; }
    .controls input[type="range"] { width: 140px; }
    .controls .val { font-variant-numeric: tabular-nums; min-width: 32px; color: #1B3C5A; font-weight: 500; }

    /* ============================================================
       FEJ ANIMATION — running state
       Variables let you tune live with the sliders above.
       ============================================================ */
    .fej-logo.fej-state-running {
      filter: grayscale(100%) opacity(var(--fej-fade, 0.5));
    }
    .fej-logo.fej-state-running #Shadow {
      animation: fej-shadow-pulse var(--fej-speed, 1.4s) ease-in-out infinite;
    }
    @keyframes fej-shadow-pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: var(--fej-pulse-min, 0.2); }
    }
    @media (prefers-reduced-motion: reduce) {
      .fej-logo.fej-state-running #Shadow {
        animation: none;
        opacity: 0.6;
      }
    }
  </style>
</head>
<body>
  <h1>FEJ logo — animation test</h1>
  <p>Left: static. Right: running state. Use sliders to tune the effect.</p>

  <div class="controls">
    <label>Fade <input type="range" id="fade" min="0.2" max="1" step="0.05" value="0.5"><span class="val" id="fade-v">0.50</span></label>
    <label>Pulse depth <input type="range" id="pulse" min="0" max="0.9" step="0.05" value="0.2"><span class="val" id="pulse-v">0.20</span></label>
    <label>Speed <input type="range" id="speed" min="0.5" max="3" step="0.1" value="1.4"><span class="val" id="speed-v">1.4s</span></label>
  </div>

  <div class="row">
    <div class="demo">
      <div id="static-slot">Loading…</div>
      <span class="lbl">Static (reference)</span>
      <span class="sub">no class applied</span>
    </div>
    <div class="demo">
      <div id="running-slot">Loading…</div>
      <span class="lbl">Running</span>
      <span class="sub">faded + shadow pulse</span>
    </div>
  </div>

  <script>
    // Load the real SVG file once, then inject into both slots.
    // This avoids retyping path data and guarantees fidelity.
    fetch('fej_logo.svg')
      .then(r => r.text())
      .then(svgText => {
        document.getElementById('static-slot').innerHTML  = svgText;
        document.getElementById('running-slot').innerHTML = svgText;
        // Add the running class to the second SVG
        const running = document.querySelector('#running-slot svg');
        running.classList.add('fej-logo', 'fej-state-running');
      })
      .catch(err => {
        document.getElementById('static-slot').textContent = 'Failed to load fej_logo.svg — see console';
        console.error(err);
      });

    // Wire up the live tuning sliders
    const root = document.documentElement;
    function bind(id, prop, suffix='') {
      const input = document.getElementById(id);
      const out = document.getElementById(id + '-v');
      const update = () => {
        const v = parseFloat(input.value);
        root.style.setProperty(prop, v + suffix);
        out.textContent = suffix === 's' ? v.toFixed(1) + 's' : v.toFixed(2);
      };
      input.addEventListener('input', update);
      update();
    }
    bind('fade',  '--fej-fade');
    bind('pulse', '--fej-pulse-min');
    bind('speed', '--fej-speed', 's');
  </script>
</body>
</html>

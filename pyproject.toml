[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "friedeggjellyfish"
version = "0.1.1"
description = "Real-time visual monitoring for code-built automations. See your automations glow."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Kenneth Ebilane", email = "ebilanekenneth@gmail.com" }
]
keywords = ["automation", "monitoring", "dashboard", "workflow", "claude-code", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
]

[project.urls]
Homepage = "https://github.com/kenebi/friedeggjellyfish"
Repository = "https://github.com/kenebi/friedeggjellyfish"
Issues = "https://github.com/kenebi/friedeggjellyfish/issues"

[project.scripts]
friedeggjellyfish = "friedeggjellyfish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
friedeggjellyfish = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js", "dashboard/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
